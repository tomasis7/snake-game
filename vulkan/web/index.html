<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furious Snake (WASM)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 1200 x 800 canvas, CSS-scaled to the largest centred 3:2 rect that fits. */
  #game { width: min(100vw, 150vh); height: min(66.6667vw, 100vh); display: block; }
  #message { display: none; color: #fff; font: 16px/1.5 monospace; max-width: 40em; padding: 2em; text-align: center; }
  #bench-result { display: none; position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 4px 8px;
    color: #0f0; background: rgba(0,0,0,.7); font: 12px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game" width="1200" height="800"></canvas>
<div id="message"></div>
<pre id="bench-result"></pre>
<script type="module">
  import init from "./furious_web.js";
  init().catch((e) => {
    const m = document.getElementById("message");
    m.style.display = "block";
    m.textContent = "Failed to start: " + e;
    console.error(e);
  });
</script>
</body>
</html>
